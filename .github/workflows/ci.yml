# =============================================================
# CI
#
# Runs on every push and pull request. Keeps the site deployable by
# failing fast on a broken build, a type error, or a failing ingestion
# test — before it reaches new24hr.vercel.app.
# =============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: news-magazine/apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: news-magazine/apps/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # Isolated dist dir so this can never collide with a local dev server.
      - run: npm run build:verify

  ingestion:
    name: Ingestion
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: news-magazine/apps/ingestion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: news-magazine/apps/ingestion/requirements.txt

      - run: pip install -r requirements.txt
      - run: pytest -q

      - name: Every module must import
        # A module that fails to import only shows up when a job happens
        # to touch it. This catches a bad import on the very first run.
        run: |
          python -c "
          import app.config, app.database, app.main, app.worker
          import app.services.adapters, app.services.dedup
          import app.services.ingestion, app.services.summarizer
          import app.services.search_resurrect
          import app.sources.base, app.sources.generic_rss
          import app.sources.html_listing, app.sources.media
          import app.workers.scheduler
          print('all modules import cleanly')
          "