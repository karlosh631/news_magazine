# =============================================================
# Re-resolve the artwork of the rows the marker has not visited
#
# WHY THIS IS A SEPARATE WORKFLOW
# -------------------------------
# The poll's own repair pass re-resolves five rows a poll per
# source. That is the right shape for a steady state - a row is
# fetched exactly once, ever, and the marker stops it being fetched
# again.
#
# It is the wrong shape for a BACKLOG. There were rows whose picture
# had never been confirmed against their own page, because an
# ingestion build older than the fix had been writing them for days
# without the marker. At five a poll per source, the biggest
# contributors would take days to clear, and every one of those rows
# is a card on the site with no picture on it.
#
# So this walks the backlog directly, newest first, across every
# source, and it is dispatched by hand (or on a schedule) rather than
# run on every poll.
#
# WHAT IT DOES AND DOES NOT DO
# ----------------------------
# It only ever replaces a picture with one that was found on the
# story's OWN page, and it marks the row so the site will show it. A
# picture that cannot be proven is left unverified, and the site
# shows the story without one - which is the operator's rule: a
# picture must belong to its story, and a story with no picture is
# fine.
#
# It never invents a picture, and it never takes one from a feed.
#
# THE SECOND PASS
# ---------------
# The pass above works on the rows the marker has never visited. It
# cannot help a row the marker HAS visited and whose picture is still
# wrong - and there were those: rows written by an ingestion build
# older than the rules, carrying a photograph of a different story.
#
# Two cheap signals find them without fetching anything: a stored
# picture that is a resizer URL (the current code never stores one, so
# its presence is proof of an old build) and a stored picture that is
# on more than one story (a photograph belongs to one story).
#
# So the run finishes with scripts/fix_wrong_images.py, which fetches
# each suspect's OWN page, asks the repo's own extractor what that page
# offers as the story's picture, and replaces the picture when the page
# proves a different one. A page that cannot be read is not evidence
# that the picture is wrong, so those rows are left exactly as they
# are.
# =============================================================

name: Refresh images

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many rows to touch in this run"
        required: false
        default: "250"
      delay:
        description: "Seconds to wait between rows"
        required: false
        default: "1"
  schedule:
    # 03:40 UTC every day - a quiet hour, and after the 01:00 Nepal
    # almanac fetch so the two do not compete for the publishers.
    - cron: "40 3 * * *"

concurrency:
  group: refresh-images
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Re-resolve the artwork
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: news-magazine/apps/ingestion/requirements.txt

      - name: Install ingestion dependencies
        working-directory: news-magazine/apps/ingestion
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Write .env from repository secrets
        working-directory: news-magazine/apps/ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INGESTION_SECRET: ${{ secrets.INGESTION_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          missing=0
          for var in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY INGESTION_SECRET CRON_SECRET; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing secret: $var"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add these under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY"
            echo "INGESTION_SECRET=$INGESTION_SECRET"
            echo "CRON_SECRET=$CRON_SECRET"
            echo "SCHEDULER_ENABLED=false"
            echo "LOG_LEVEL=INFO"
            echo "LOG_FORMAT=console"
          } > .env

      - name: Re-resolve the artwork
        working-directory: news-magazine/apps/ingestion
        env:
          LIMIT: ${{ inputs.limit || '250' }}
          DELAY: ${{ inputs.delay || '1' }}
        run: |
          # The runner hands this block to `bash -e`, so -e is ALREADY
          # on. `set -uo pipefail` adds to it and never turns it off,
          # which means the first row that could not be proven used to
          # end the whole step before it could say what had happened.
          # A pass that half worked has to REPORT that it half worked.
          set +e
          set -uo pipefail
          python -m scripts.refresh_images --limit "$LIMIT" --delay "$DELAY" 2>&1 | tee refresh.log
          if grep -q "REFRESH_OK=1" refresh.log; then
            echo "::notice::The artwork backlog has been worked through."
          else
            echo "::warning::The artwork refresh did not finish cleanly. The rows it did not reach keep their unverified picture, and the site shows those stories without one."
          fi
          exit 0

      - name: Find the pictures that are not their story's
        # This one runs even when the pass above did not finish: the
        # two passes look at DIFFERENT rows, so the second one still
        # has work to do.
        if: always()
        working-directory: news-magazine/apps/ingestion
        env:
          LIMIT: ${{ inputs.limit || '250' }}
          DELAY: ${{ inputs.delay || '1' }}
        run: |
          set +e
          set -uo pipefail
          # The pass above works on the rows the marker has never
          # visited. This one works on the rows the marker HAS visited
          # but whose picture is provably wrong: a resizer URL (which
          # the current code never stores) or a photograph that is on
          # more than one story.
          python -m scripts.fix_wrong_images --limit "$LIMIT" --delay "$DELAY" 2>&1 | tee fix-wrong.log
          if grep -q "FIX_OK=1" fix-wrong.log; then
            echo "::notice::Every suspect picture has been checked against its own story."
          else
            echo "::warning::The wrong-picture pass did not finish cleanly."
          fi
          exit 0

      - name: Repair the headlines, the points and the pictures
        working-directory: news-magazine/apps/ingestion
        env:
          LIMIT: ${{ inputs.limit || '250' }}
          DELAY: ${{ inputs.delay || '1' }}
        run: |
          set +e
          set -uo pipefail
          # The rows whose HEADLINE is the listing card rather than the
          # headline: "canadanepal.com . 33 minutes ago Cyber security
          # risks ... | The web technology (PHP) ...". The card's text
          # also became the story's four key points, and - because the
          # page could not be read - the picture could not be proven,
          # so the card showed the points instead of the photograph
          # that is on the real page.
          #
          # This reads each such story's OWN page (through the reader
          # when the publisher refuses this address) and takes all
          # three from it: the headline exactly as the outlet published
          # it, the four points in the outlet's own words, and the
          # picture, proven.
          python -m scripts.repair_headlines_and_pictures --limit "$LIMIT" --delay "$DELAY" 2>&1 | tee repair.log
          if grep -q "REPAIR_OK=1" repair.log; then
            echo "::notice::The rows that were showing a listing card have been repaired."
          else
            echo "::warning::The headline repair did not finish cleanly. The rows it did not reach keep their old headline."
          fi
          exit 0

      - name: Upload the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-images-log-${{ github.run_number }}
          path: |
            news-magazine/apps/ingestion/refresh.log
            news-magazine/apps/ingestion/fix-wrong.log
            news-magazine/apps/ingestion/repair.log
          retention-days: 7
