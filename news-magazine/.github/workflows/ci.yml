name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  ingestion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest

  # Deploy jobs are intentionally left as manual/Vercel & Render's native
  # git integrations rather than duplicated here — both platforms deploy
  # automatically on push to main once connected, and only after this
  # workflow's checks pass (branch protection rule), satisfying
  # "do not deploy if critical tests fail."
