<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="55%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow
        dx="0"
        dy="2"
        stdDeviation="2"
        flood-opacity="0.28"
      />
    </filter>
  </defs>

  <!-- Modern rounded background -->
  <rect
    width="64"
    height="64"
    rx="16"
    fill="url(#bg)"
  />

  <!-- Subtle globe -->
  <circle
    cx="32"
    cy="32"
    r="22"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.12"
    stroke-width="1.5"
  />

  <ellipse
    cx="32"
    cy="32"
    rx="10"
    ry="22"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.10"
    stroke-width="1.5"
  />

  <path
    d="M10 32h44"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.10"
    stroke-width="1.5"
  />

  <!-- N24 monogram -->
  <g filter="url(#shadow)">
    <!-- N -->
    <path
      d="M14 44V20h5l10 15V20h6v24h-5L20 29v15z"
      fill="url(#accent)"
    />

    <!-- 2 -->
    <path
      d="M39 25
         c0-3 2-5 6-5
         c4 0 6 2 6 5
         c0 3-2 5-5 7
         l-4 3h9v5H35v-4
         l10-8
         c1-1 2-2 2-3
         c0-1-1-2-2-2
         c-1 0-2 1-2 3z"
      fill="url(#accent)"
    />
  </g>

  <!-- Breaking-news pulse -->
  <circle
    cx="51"
    cy="13"
    r="5"
    fill="#ef4444"
  />

  <circle
    cx="51"
    cy="13"
    r="2"
    fill="#ffffff"
  />

  <!-- Small live indicator -->
  <path
    d="M43 10h5"
    stroke="#ffffff"
    stroke-width="2"
    stroke-linecap="round"
    opacity="0.9"
  />
</svg>
