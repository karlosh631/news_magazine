# Local development only. In production: Vercel (web) + Supabase (db/auth)
# + Render (ingestion) — see README.md and ARCHITECTURE.md.
version: "3.9"
services:
  ingestion:
    build: ./apps/ingestion
    ports:
      - "8000:8000"
    env_file:
      - ./apps/ingestion/.env
    restart: unless-stopped
